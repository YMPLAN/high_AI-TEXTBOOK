<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>고등학교 인공지능 기초 스마트 수업</title>
  <meta name="description" content="길벗 2022 개정 고등학교 인공지능 기초 교과서 기반 스마트 수업" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside id="sidebar">
      <header class="brand"><strong>✦</strong><div><small>SMART CLASS</small><b>인공지능 기초</b></div></header>
      <nav id="units" aria-label="단원별 슬라이드"></nav>
      <footer>← → 이동 · Space 단계 공개<br>길벗 2022 개정 교과서 기반</footer>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button id="menu" aria-label="목차 열기">☰</button>
        <div><b id="unitTitle"></b><small id="sectionTitle"></small></div>
        <div class="counter"><span id="counter"></span><i><em id="progress"></em></i></div>
      </header>
      <main>
        <article id="slide" tabindex="0"></article>
        <nav class="controls" aria-label="슬라이드 이동">
          <button id="prev">← 이전</button>
          <span id="currentSection"></span>
          <button id="next">다음 →</button>
        </nav>
      </main>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
